name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tipos (backend y frontend)
        run: npm run typecheck
      - name: Lint (frontend)
        run: npm run lint
      - name: Pruebas del backend
        run: npm test
      - name: Compilación del frontend
        run: npm run build
